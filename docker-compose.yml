name: helix-webui

services:
  helix-webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/helix/}
    image: ${IMAGE_TAG:-helix-webui:latest}
    container_name: helix-webui
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_HOST: ${API_HOST:-helix-api}
      API_PORT: ${API_PORT:-8000}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "80"
    ports:
      - target: 80
        published: ${PUBLISH_PORT:-80}
        protocol: tcp
    networks:
      - helix-net
      - erp-net

networks:
  helix-net:
    name: ${DOCKER_NETWORK:-helix-net}
    external: true
  erp-net:
    name: erp-net
    external: true
